name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    strategy:
      fail-fast: false
      matrix:
        include:
          - plateforme: windows-latest
            args: ""
          - plateforme: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.plateforme }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.plateforme == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenLex ${{ github.ref_name }}"
          releaseBody: |
            Première version d'OpenLex : prédiction phonétique + synthèse vocale, 100 % hors ligne.

            **Windows** : télécharge le fichier `.msi` ou `-setup.exe`. Windows peut afficher « Windows a protégé votre ordinateur » parce que l'app n'est pas encore signée : clique sur « Informations complémentaires » puis « Exécuter quand même ».
            **macOS** : télécharge le `.dmg`. L'app n'est pas encore notarisée : clic droit › Ouvrir la première fois.

            Voir le README pour les détails.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
