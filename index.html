<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenLex</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main>
      <header>
        <h1>OpenLex</h1>
        <p class="sous-titre">Aide libre pour lire et écrire</p>
      </header>

      <section aria-labelledby="titre-auto" class="auto">
        <label class="interrupteur">
          <input id="auto" type="checkbox" checked />
          <span>
            <strong id="titre-auto">Suggestions automatiques partout</strong>
            <span class="aide">Écris dans Word, Docs… et choisis avec <kbd>Ctrl</kbd> + <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></span>
          </span>
        </label>
        <p id="auto-erreur" class="erreur" hidden></p>
      </section>

      <section aria-labelledby="titre-mot">
        <h2 id="titre-mot">Trouver un mot</h2>
        <label for="saisie" class="aide">Écris le mot comme tu l'entends</label>
        <input
          id="saisie"
          type="text"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="ex. : fotografi"
        />
        <ol id="suggestions" aria-live="polite"></ol>
        <p class="astuce">Clique sur un mot (ou tape son chiffre) pour l'écrire dans ton texte.</p>
      </section>

      <section aria-labelledby="titre-lire">
        <h2 id="titre-lire">Lire à voix haute</h2>
        <textarea
          id="texte"
          rows="4"
          placeholder="Colle ton texte ici… ou sélectionne du texte dans Word ou Docs et fais le raccourci."
        ></textarea>
        <div id="lecture" hidden></div>
        <div class="boutons">
          <button id="lire" type="button">🔊 Lire</button>
          <button id="arreter" type="button" class="secondaire">⏹ Arrêter</button>
        </div>
        <p class="astuce">Raccourci partout : <kbd id="raccourci">Ctrl</kbd> + <kbd>Maj</kbd> + <kbd>L</kbd></p>
      </section>

      <p id="message" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
